name: US Collector

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '티커 (예: TSLA, AAPL)'
        required: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 링크 수집 실행
        run: python us_collector.py "${{ github.event.inputs.ticker }}"

      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.ticker }}-filings-collection
          path: "*_filings_collection.html"
          retention-days: 30
